name: Tuning data
# Manual: freezes the networks, makes real-speech test scenes, and stores them on the
# 'tuning-data' branch so the separation can be tuned off the Mac.
on:
  workflow_dispatch:
  push:
    branches: [tuning]
permissions:
  contents: write
jobs:
  data:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchaudio==2.6.0 -r requirements.txt speechbrain==1.0.3 "huggingface_hub<0.26"
      - name: Freeze networks and make scenes
        run: |
          python tools/export_models.py
          python tests/make_say_scene.py out/scene
          say -v '?' > out/voices.txt
          mkdir -p out/models && cp untie/models/* out/models/
      - name: Push to the tuning-data branch
        run: |
          cd out
          git init -q -b tuning-data
          git config user.name "Un-tie build"; git config user.email "build@soundbrewery.in"
          git add -A && git commit -qm "tuning data"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tuning-data
